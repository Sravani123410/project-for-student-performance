{% extends 'base.html' %}

{% block title %}{% if course %}Edit Course{% else %}Add New Course{% endif %}{% endblock %}

{% block content %}
<div style="max-width: 560px; margin: 2rem auto;">
    <div class="glass-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>
                {% if course %}
                <i class="fa-solid fa-pen-to-square" style="color: var(--accent-purple);"></i> Edit Course
                {% else %}
                <i class="fa-solid fa-plus-circle" style="color: var(--accent-purple);"></i> Add New Course
                {% endif %}
            </h2>
            <a href="{{ url_for('list_courses') }}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-xmark"></i> Cancel</a>
        </div>

        <form action="{% if course %}{{ url_for('update_course_full', id=course.id) }}{% else %}{{ url_for('create_course') }}{% endif %}" method="POST">
            {% if course %}
            <input type="hidden" name="_method" id="methodOverride" value="PUT">
            {% endif %}

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="code">Course Code</label>
                    <input type="text" id="code" name="code" class="form-control" placeholder="e.g. CS101" value="{{ course.code if course else '' }}" required style="text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label class="form-label" for="credits">Credit Hours</label>
                    <input type="number" id="credits" name="credits" class="form-control" placeholder="3" min="1" max="6" value="{{ course.credits if course else 3 }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="name">Course Title</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Operating Systems & Architecture" value="{{ course.name if course else '' }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Course Description</label>
                <textarea id="description" name="description" class="form-control" rows="4" placeholder="Brief summary of course scope and prerequisites...">{{ course.description if course else '' }}</textarea>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                {% if course %}
                <button type="submit" onclick="document.getElementById('methodOverride').value='PUT'" class="btn btn-primary" style="flex: 1;">
                    <i class="fa-solid fa-floppy-disk"></i> Full Update (PUT)
                </button>
                <button type="submit" onclick="document.getElementById('methodOverride').value='PATCH'" class="btn btn-secondary" style="flex: 1;">
                    <i class="fa-solid fa-pen-nib"></i> Partial Update (PATCH)
                </button>
                {% else %}
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-plus"></i> Save Course Offering
                </button>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
