{% extends 'base.html' %}

{% block title %}Register Account - Student Analytics{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 1rem auto; background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Create New Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Register as Admin or Student</p>
        </div>

        <form action="{{ url_for('register_page') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. john@university.edu" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="role">Account Role</label>
                <select id="role" name="role" class="form-control">
                    <option value="student">Student (View data & grades)</option>
                    <option value="admin">Administrator (Full CRUD & manage records)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--card-border); padding-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login_page') }}" style="font-weight: 600;">Log In Here</a>
        </div>
    </div>
</div>
{% endblock %}
